apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service
  namespace: investment-fund
spec:
  replicas: 3
  selector:
    matchLabels:
      app: employee-service
  template:
    metadata:
      labels:
        app: employee-service
    spec:
      containers:
        - name: employee-service
          image: projekat-employee-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001

          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: investment-fund-secret
                  key: JWT_SECRET_KEY

            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: investment-fund-config
                  key: MONGO_HOST

            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: investment-fund-config
                  key: MONGO_PORT

            - name: MONGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: investment-fund-config
                  key: MONGO_DATABASE

            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: investment-fund-config
                  key: MONGO_URI

            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: investment-fund-config
                  key: REDIS_HOST

            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: investment-fund-config
                  key: REDIS_PORT

          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10

          livenessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: employee-service
  namespace: investment-fund
spec:
  selector:
    app: employee-service
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001