apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication-service
  namespace: investment-fund
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication-service
  template:
    metadata:
      labels:
        app: authentication-service
    spec:
      containers:
        - name: authentication-service
          image: projekat-authentication-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: investment-fund-secret
                  key: DATABASE_URL

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: investment-fund-secret
                  key: JWT_SECRET_KEY

          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10

          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: authentication-service
  namespace: investment-fund
spec:
  selector:
    app: authentication-service
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000