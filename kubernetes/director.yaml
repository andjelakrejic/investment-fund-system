apiVersion: apps/v1
kind: Deployment
metadata:
  name: director-service
  namespace: investment-fund
spec:
  replicas: 1
  selector:
    matchLabels:
      app: director-service
  template:
    metadata:
      labels:
        app: director-service
    spec:
      containers:
        - name: director-service
          image: projekat-director-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 5002

          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: investment-fund-secret
                  key: JWT_SECRET_KEY

            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: investment-fund-config
                  key: MONGO_HOST

            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: investment-fund-config
                  key: MONGO_PORT

            - name: MONGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: investment-fund-config
                  key: MONGO_DATABASE

            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: investment-fund-config
                  key: MONGO_URI

            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: investment-fund-config
                  key: REDIS_HOST

            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: investment-fund-config
                  key: REDIS_PORT

            - name: BLOCKCHAIN_URL
              valueFrom:
                configMapKeyRef:
                  name: investment-fund-config
                  key: BLOCKCHAIN_URL

          readinessProbe:
            tcpSocket:
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 10

          livenessProbe:
            tcpSocket:
              port: 5002
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: director-service
  namespace: investment-fund
spec:
  selector:
    app: director-service
  ports:
    - protocol: TCP
      port: 5002
      targetPort: 5002
  type: NodePort