apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: investment-database-pvc
  namespace: investment-fund
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: investment-database
  namespace: investment-fund
spec:
  replicas: 1
  selector:
    matchLabels:
      app: investment-database
  template:
    metadata:
      labels:
        app: investment-database
    spec:
      containers:
        - name: investment-database
          image: mongo:8
          ports:
            - containerPort: 27017

          volumeMounts:
            - name: investment-database-storage
              mountPath: /data/db

          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10

          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

      volumes:
        - name: investment-database-storage
          persistentVolumeClaim:
            claimName: investment-database-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: investment-database
  namespace: investment-fund
spec:
  selector:
    app: investment-database
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  type: ClusterIP