apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain
  namespace: investment-fund
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockchain
  template:
    metadata:
      labels:
        app: blockchain
    spec:
      containers:
        - name: blockchain
          image: trufflesuite/ganache-cli:latest
          ports:
            - containerPort: 8545
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8545"
            - --networkId
            - "1337"
            - --chainId
            - "1337"
            - --deterministic
            - --accounts
            - "10"
            - --defaultBalanceEther
            - "1000"

          readinessProbe:
            tcpSocket:
              port: 8545
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10

          livenessProbe:
            tcpSocket:
              port: 8545
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: blockchain
  namespace: investment-fund
spec:
  selector:
    app: blockchain
  ports:
    - protocol: TCP
      port: 8545
      targetPort: 8545
  type: ClusterIP